name: Build APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Aceitar licenças do Android SDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true

      - name: Instalar NDK e CMake
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          "$SDKM" --install "ndk;27.0.12077973" "cmake;3.22.1"
          "$SDKM" --list_installed | head -20

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Cache ferramentas de recompilação (binários)
        uses: actions/cache@v4
        with:
          path: tools/build
          key: recomp-tools-${{ runner.os }}-v3

      # NOTA: sem cache de app/.cxx — o código gerado é recriado a cada run
      # (novos mtimes ⇒ ninja recompilaria tudo de qualquer forma), e objetos
      # restaurados com mtime novo silenciosamente pulariam TUs alterados.

      - name: Compilar ferramentas (XexTool, XenonAnalyse, XenonRecomp)
        run: |
          chmod +x tools/build_recomp_tools.sh tools/run_recomp.sh
          tools/build_recomp_tools.sh

      - name: Baixar default.xex (repo privado via secrets.GH_PAT)
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          FH2_XEX_REPO: ${{ secrets.FH2_XEX_REPO }}
        run: |
          if [ -z "$GH_PAT" ]; then
            echo "::error::Secret GH_PAT ausente. Configure em Settings → Secrets and variables → Actions."
            exit 1
          fi
          chmod +x tools/fetch_xex.sh
          tools/fetch_xex.sh

      - name: Recompilar PowerPC → C++ (XenonRecomp)
        run: tools/run_recomp.sh

      - name: Dar permissão ao Gradle Wrapper
        run: chmod +x ./gradlew

      - name: Build APK (Debug)
        run: ./gradlew assembleDebug --stacktrace

      - name: Build APK (Release) — assinado com keystore via secrets quando presente
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload APK Debug
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload APK Release
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app/build/outputs/apk/release/*.apk

      - name: Upload código recompilado (diagnóstico)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recomp-log
          path: |
            recomp/config/save_restore.txt
            recomp/generated/ppc_config.h
          if-no-files-found: ignore
