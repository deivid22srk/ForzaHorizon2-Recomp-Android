// Módulo Android — ForzaHorizon2-Recomp-Android
// Runtime nativo mobile-first: Vulkan/GLES, AAudio, input touch + gamepad.
apply plugin: 'com.android.application'

android {
    namespace 'com.fh2recomp'
    compileSdk 35
    ndkVersion '27.0.12077973'

    defaultConfig {
        applicationId 'com.fh2recomp'
        minSdk 28
        targetSdk 35
        versionCode 1
        versionName '0.1.0'

        ndk {
            // Xenon (Xbox 360) é ARM64 compatível via recomp; 64-bit obrigatório
            abiFilters 'arm64-v8a'
        }

        externalNativeBuild {
            cmake {
                cppFlags '-std=c++20 -frtti -fexceptions'
                arguments '-DANDROID_STL=c++_shared',
                          '-DCMAKE_BUILD_TYPE=Release'
            }
        }
    }

    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
            version '3.22.1+'
        }
    }

    // Assinatura release: keystore via secrets do CI (base64) quando presente;
    // fallback = assinatura debug (APK instalável em qualquer device). Nenhum
    // keystore é commitado.
    def keystoreB64 = System.getenv("KEYSTORE_BASE64")
    def ksFile = keystoreB64 ? File.createTempFile("fh2release", ".jks") : null
    if (ksFile) {
        ksFile.bytes = new ByteArrayInputStream(keystoreB64.decodeBase64())
    }
    signingConfigs {
        if (keystoreB64) {
            release {
                storeFile ksFile
                storePassword System.getenv("KEYSTORE_PASSWORD")
                keyAlias System.getenv("KEY_ALIAS")
                keyPassword System.getenv("KEY_PASSWORD")
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig keystoreB64 ? signingConfigs.release : signingConfigs.debug
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            applicationIdSuffix '.debug'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging true
        }
    }

    lint {
        abortOnError false
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.preference:preference:1.2.1'
    implementation 'androidx.activity:activity:1.9.3'

    // Resolve conflito kotlin-stdlib-jdk8 1.6.21 (transitivo) vs kotlin-stdlib 1.8.22
    constraints {
        implementation('org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22') {
            because 'alinhamento com kotlin-stdlib 1.8.22'
        }
        implementation('org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22') {
            because 'alinhamento com kotlin-stdlib 1.8.22'
        }
    }
}
